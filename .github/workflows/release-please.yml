name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: step-security/release-please-action@26a11e1978efcda4d5c2834bd4c39a74a717cab6 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
